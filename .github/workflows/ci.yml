name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt-and-docs:
    name: Format, Docs & Packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-cargo

      - name: Check formatting
        run: cargo fmt --check

      - name: Check rustdoc cleanly
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

      - name: Validate shell scripts & packaging manifests
        run: |
          command -v shellcheck >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y shellcheck)
          shellcheck install.sh packaging/rpm/postinst.sh packaging/debian/postinst
          shellcheck -s bash packaging/arch/kkfetch.install
          python3 -c '
          import json, pathlib, re
          cargo_ver = re.search(r"^version\s*=\s*\"([^\"]+)\"", pathlib.Path("Cargo.toml").read_text(), re.M).group(1)
          scoop = json.loads(pathlib.Path("packaging/scoop/kkfetch.json").read_text())
          ver = scoop["version"]
          assert ver == cargo_ver, f"Scoop version {ver} != Cargo.toml {cargo_ver}"
          h = scoop["architecture"]["64bit"]["hash"]
          assert re.fullmatch(r"[0-9a-f]{64}", h), f"Invalid Scoop SHA-256: {h}"
          '

  clippy:
    name: Clippy Linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-cargo

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-cargo

      - name: Run tests
        run: cargo test --all-targets --all-features

  build:
    name: Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [fmt-and-docs, clippy, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-cargo

      - name: Build release binary
        run: cargo build --release --bin kkfetch

      - name: Test binary execution and completions
        run: |
          ./target/release/kkfetch --version
          ./target/release/kkfetch --help
          ./target/release/kkfetch --json --no-plugins >/dev/null
          test -f completions/kkfetch.bash
          test -f completions/_kkfetch
          test -f completions/kkfetch.fish

  cross-platform:
    name: Cross-Platform Check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}-cargo

      - name: Check targets
        run: cargo check --target ${{ matrix.target }} --all-targets

  msrv:
    name: MSRV Verification (1.85.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.85.0"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-cargo

      - name: Verify MSRV check
        run: cargo check --all-targets --all-features

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Supply-Chain & License Governance (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
