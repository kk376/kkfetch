[package]
name = "kkfetch"
version = "0.15.1"
edition = "2021"
rust-version = "1.75.0"
authors = ["Kushagra Kumar <kk376>"]
description = "A fast, lightweight Linux, macOS, and Windows system information fetch tool written in Rust"
readme = "README.md"
license = "MIT"
repository = "https://github.com/kk376/kkfetch"
homepage = "https://github.com/kk376/kkfetch"
documentation = "https://docs.rs/kkfetch"
keywords = ["fetch", "system-info", "linux", "windows", "cli"]
categories = ["command-line-utilities"]
include = [
    "src/**/*",
    "completions/**/*",
    "tests/**/*",
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]

[dependencies]
clap = { version = "~4.5.31", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
assert_cmd = "~2.0.14"
clap_complete = "~4.5.31"
predicates = "~3.1.0"
tempfile = "=3.10.1"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/kkfetch", dest = "/usr/bin/kkfetch", mode = "755" },
    { source = "completions/kkfetch.bash", dest = "/usr/share/bash-completion/completions/kkfetch", mode = "644" },
    { source = "completions/_kkfetch", dest = "/usr/share/zsh/site-functions/_kkfetch", mode = "644" },
    { source = "completions/kkfetch.fish", dest = "/usr/share/fish/vendor_completions.d/kkfetch.fish", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/kkfetch/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/kkfetch/LICENSE", mode = "644" },
]
post_install_script = "packaging/rpm/postinst.sh"

[package.metadata.deb]
maintainer = "Kushagra Kumar <kk376>"
copyright = "2026 Kushagra Kumar (kk376)"
license-file = ["LICENSE", "4"]
extended-description = "A fast, lightweight Linux system information fetch tool written in Rust."
maintainer-scripts = "packaging/debian"
section = "utils"
priority = "optional"
assets = [
    ["target/release/kkfetch", "usr/bin/kkfetch", "755"],
    ["completions/kkfetch.bash", "usr/share/bash-completion/completions/kkfetch", "644"],
    ["completions/_kkfetch", "usr/share/zsh/vendor-completions/_kkfetch", "644"],
    ["completions/kkfetch.fish", "usr/share/fish/vendor_completions.d/kkfetch.fish", "644"],
    ["README.md", "usr/share/doc/kkfetch/README.md", "644"],
    ["LICENSE", "usr/share/licenses/kkfetch/LICENSE", "644"],
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }"
bin-dir = "{ name }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-musl-x86_64"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-musl-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-musl-aarch64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-musl-aarch64"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true



